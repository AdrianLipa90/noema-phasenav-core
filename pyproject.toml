[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciel-phasenav"
version = "0.8.0"
description = "PhaseNav canonical observer-to-CIELingo generation-state dynamics with holonomic memory, HTRI, typed TIR×½ firewalls, provenance closure, and digest-native Git commit/tree/blob routing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "pyyaml>=6.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = ["cupy>=12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/AdrianLipa90/noema-phasenav-core"
Repository = "https://github.com/AdrianLipa90/noema-phasenav-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ciel_geometry.phasenav" = ["data/*.npy", "data/*.jsonl"]
"ciel_geometry.phasenav.data" = ["*"]
"ciel_geometry.phasenav.canon" = ["CURRENT", "canon_manifest.json"]
