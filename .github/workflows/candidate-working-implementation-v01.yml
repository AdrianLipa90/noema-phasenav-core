name: Candidate working implementation policy v0.1

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911
  workflow_dispatch:

jobs:
  targeted-registry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e .[dev]
      - name: Run candidate registry gate
        run: pytest -q tests/test_working_implementation_registry.py

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e .[dev]
      - name: Run complete repository regression and capture output
        id: regression
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee full-regression.log
      - name: Upload full regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-full-regression-log
          path: full-regression.log
          retention-days: 7
      - name: Preserve regression failure
        if: steps.regression.outcome != 'success'
        run: exit 1
