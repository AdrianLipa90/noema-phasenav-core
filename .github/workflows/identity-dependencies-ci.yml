name: PhaseNav identity dependencies CI

on:
  push:
    branches:
      - canon/sigma-identity-cycle-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile dependency modules
        run: |
          python -m compileall -q src/ciel_geometry/phasenav/dependencies src/ciel_geometry/phasenav/canon/identity_dependency_bridge.py
      - name: Run full repository tests
        run: |
          pytest -q
