name: PhaseNav memory consolidation retention v0.1

on:
  pull_request:
    branches:
      - master
      - formalism/memory-anti-entropy-sync-v01-20260920
    paths:
      - 'src/ciel_geometry/phasenav/canon/memory_exchange.py'
      - 'src/ciel_geometry/phasenav/canon/memory_consolidation.py'
      - 'src/ciel_geometry/phasenav/canon/__init__.py'
      - 'src/ciel_geometry/phasenav/__init__.py'
      - 'tests/test_memory_consolidation.py'
      - 'docs/memory_consolidation_retention_v01.md'
      - 'CHANGELOG_APPEND_ONLY.md'
      - '.github/workflows/phasenav-memory-consolidation-v01.yml'

permissions:
  contents: read

jobs:
  memory-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile consolidation modules
        run: >-
          python -m py_compile
          src/ciel_geometry/phasenav/canon/memory_exchange.py
          src/ciel_geometry/phasenav/canon/memory_consolidation.py
      - name: Run focused consolidation tests
        run: >-
          python -m pytest -q
          tests/test_memory_exchange.py
          tests/test_memory_consolidation.py
